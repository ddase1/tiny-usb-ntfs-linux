name: Build Tiny Linux (USB + NTFS modular)
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt update
          sudo apt install -y build-essential bison flex libssl-dev bc wget xz-utils

      - name: Build kernel
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Package modules
        run: |
          cd out-modules
          tar -zcf ../modules.tar.gz lib/

      - name: Upload bzImage
        uses: actions/upload-artifact@v4
        with:
          name: bzImage
          path: out/bzImage

      - name: Upload modules
        uses: actions/upload-artifact@v4
        with:
          name: modules
          path: modules.tar.gz
